name: Test fail_level none does not fail on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with fail_level none (should not fail even with violations)
        id: action
        uses: .
        with:
          github_token: "dummy-token"
          workdir: testdata/java
          checkstyle_config: google_checks.xml
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
      - name: Assert action did not fail
        run: |
          echo "Action completed with fail_level=none as expected"
          echo "PASS"
