name: Test invalid checkstyle_version - rejected with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal Java file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/version-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-test/Dummy.java" << 'EOF'
          /** Dummy class. */
          public class Dummy {
            /** Main method.
             * @param args args
             */
            public static void main(String[] args) {
              System.out.println("dummy");
            }
          }
          EOF

      - name: Run action with invalid checkstyle_version (path traversal attempt)
        id: action-invalid-version
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/version-test
          level: info
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          checkstyle_config: google_checks.xml
          checkstyle_version: "../../../evil"

      - name: Assert action rejected invalid version
        env:
          OUTCOME: ${{ steps.action-invalid-version.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the version string contains invalid characters
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid checkstyle_version"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected invalid version string"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
