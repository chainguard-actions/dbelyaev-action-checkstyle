name: Test checkstyle rejects invalid version string
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: checkstyle
        name: Run checkstyle with invalid version (should fail)
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java/clean
          checkstyle_config: google_checks.xml
          checkstyle_version: "../../../evil"
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: info
        continue-on-error: true

      - name: Assert action rejected invalid version string
        env:
          OUTCOME: ${{ steps.checkstyle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The entrypoint validates checkstyle_version and must reject path-traversal strings.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid checkstyle_version"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected invalid version '../../../evil'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
