name: Test invalid checkstyle_version is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: action/testdata/java
          level: info
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          checkstyle_config: google_checks.xml
          # Invalid version: contains non-numeric characters (path traversal attempt)
          checkstyle_version: "../../../evil"

      - name: Assert action failed due to invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The entrypoint validates checkstyle_version and rejects non-numeric values
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid checkstyle_version"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected invalid checkstyle_version"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
