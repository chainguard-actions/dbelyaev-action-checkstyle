name: Test fail_level causes failure on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java
          checkstyle_config: google_checks.xml
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: any

      - name: Assert action failed due to violations with fail_level=any
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=any and violations present in Application.java,
          # the action should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when violations found with fail_level=any"
          else
            echo "FAIL: expected action to fail with violations and fail_level=any, got '$OUTCOME'"
            exit 1
          fi
