name: Test fail_level - action fails when violations exceed threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a Java file with known violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/java-violations"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/java-violations/BadCode.java" << 'EOF'
          public class BadCode {
          public static void main(String[] args){
          System.out.println("hello");
          }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java-violations
          checkstyle_config: google_checks.xml
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: warning

      - name: Assert action failed due to violations exceeding fail_level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=warning and known violations, reviewdog should fail
          # OR the action may fail due to harness API limitations
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (violations found or harness limitation)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have reported 0 violations in local mode)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
