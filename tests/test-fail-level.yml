name: Test fail_level causes failure on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java-violations
          checkstyle_config: google_checks.xml
          reporter: local
          filter_mode: nofilter
          fail_level: warning
          level: warning

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=warning and a file with violations, the action should fail.
          # If no violations are found at warning level, it may succeed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected due to violations with fail_level=warning"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (violations may be below warning threshold)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
