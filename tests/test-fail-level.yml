name: Test fail_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run checkstyle with fail_level=error (should not fail on warnings)
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          checkstyle_config: google_checks.xml
          level: info
          reporter: local
          filter_mode: nofilter
          # fail_level=error means only ERROR-level violations cause failure
          # google_checks.xml reports at warning/info level by default
          fail_level: error

      - name: Assert action completed without failure
        run: |
          echo "Action completed with fail_level=error without hard failure"
          echo "PASS"
