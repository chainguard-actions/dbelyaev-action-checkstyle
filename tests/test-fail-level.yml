name: Test fail_level causes failure on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create Java file with style violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/java-violations"
          # This file intentionally has style violations (no javadoc, wrong indentation, etc.)
          cat > "$GITHUB_WORKSPACE/tests/fixtures/java-violations/BadStyle.java" << 'EOF'
          import java.util.*;
          public class BadStyle {
          public static void main(String[] args) {
          System.out.println("bad style");
          String x="no spaces around operator";
          }
          }
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action-no-fail
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java-violations
          checkstyle_config: google_checks.xml
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: none

      - name: Assert action succeeded with fail_level=none despite violations
        env:
          OUTCOME: ${{ steps.action-no-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fail_level=none as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (reviewdog may have failed for other reasons)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
