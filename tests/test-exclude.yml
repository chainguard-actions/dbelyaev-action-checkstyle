name: Test exclude removes violating files from analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/java-exclude
          checkstyle_config: tests/fixtures/exclude-config/checkstyle.xml
          reporter: local
          filter_mode: nofilter
          fail_level: any
          exclude: |
            tests/fixtures/java-exclude/excluded
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since the violating directory is excluded"
            exit 1
          fi
          echo "PASS"
