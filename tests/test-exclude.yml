name: Test exclude skips violating files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: control
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/exclude
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/exclude
          reporter: local
          filter_mode: nofilter
          fail_level: any
          exclude: |
            tests/fixtures/exclude/bad
      - name: Assert exclusion changed the result
        env:
          CONTROL: ${{ steps.control.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "control (no exclude) outcome: $CONTROL"
          echo "with exclude outcome: $OUTCOME"
          if [ "$CONTROL" != "failure" ]; then
            echo "FAIL: expected control run to fail on violations in bad/"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since violating dir is excluded"
            exit 1
          fi
          echo "PASS"
