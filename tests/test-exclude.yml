name: Test exclude removes violating directory from analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Control run: without exclude, the bad/ directory makes the action fail.
      - id: control
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/exclude
          reporter: local
          filter_mode: nofilter
          fail_level: any
      # Same run, but with the violating directory excluded. A clean file
      # (good/Good.java) remains so checkstyle still has files to process.
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/exclude
          reporter: local
          filter_mode: nofilter
          fail_level: any
          exclude: |
            tests/fixtures/exclude/bad
      - name: Assert exclude changed the outcome
        env:
          CONTROL: ${{ steps.control.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "control outcome (no exclude): $CONTROL"
          echo "outcome (with exclude): $OUTCOME"
          if [ "$CONTROL" != "failure" ]; then
            echo "FAIL: expected control run to fail due to violations in bad/"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since the violating directory is excluded"
            exit 1
          fi
          echo "PASS"
