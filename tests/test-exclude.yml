name: Test exclude input skips specified directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create Java files for exclude test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/java-exclude/src"
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/java-exclude/excluded"
          # A valid Java file in src (should be analyzed)
          cat > "$GITHUB_WORKSPACE/tests/fixtures/java-exclude/src/Main.java" << 'EOF'
          public class Main {
            public static void main(String[] args) {
              System.out.println("Hello");
            }
          }
          EOF
          # A Java file in excluded dir (should be skipped)
          cat > "$GITHUB_WORKSPACE/tests/fixtures/java-exclude/excluded/Excluded.java" << 'EOF'
          public class Excluded {
            public static void main(String[] args) {
              System.out.println("Excluded");
            }
          }
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java-exclude
          checkstyle_config: google_checks.xml
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: none
          exclude: tests/fixtures/java-exclude/excluded

      - name: Assert action ran with exclude
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: checkstyle ran with exclude successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have reported violations or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
