name: Test exclude input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run checkstyle with excluded directory
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          checkstyle_config: google_checks.xml
          exclude: testdata/java/excluded
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully with exclude
        run: |
          echo "Action completed with exclude input without hard failure"
          echo "PASS"
