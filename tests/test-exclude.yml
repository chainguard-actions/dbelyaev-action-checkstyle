name: Test exclude input - exclude directories from analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create Java files including an excluded directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/exclude-test/src"
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/exclude-test/generated"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/exclude-test/src/Main.java" << 'EOF'
          /** Main class. */
          public class Main {
            /** Entry point.
             * @param args args
             */
            public static void main(String[] args) {
              System.out.println("Main");
            }
          }
          EOF
          # This file has violations but should be excluded
          cat > "$GITHUB_WORKSPACE/tests/fixtures/exclude-test/generated/Generated.java" << 'EOF'
          public class Generated {
          public static void doSomething() {
          System.out.println("generated");
          }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/exclude-test
          level: warning
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          checkstyle_config: google_checks.xml
          exclude: |
            tests/fixtures/exclude-test/generated

      - name: Assert action ran with exclude input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with exclude input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
