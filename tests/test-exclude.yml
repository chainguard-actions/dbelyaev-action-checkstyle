name: Test checkstyle with exclude paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with excluded directory
        id: action
        uses: .
        with:
          github_token: "dummy-token"
          workdir: testdata/java
          checkstyle_config: google_checks.xml
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          exclude: |
            testdata/java/excluded
            testdata/java/excluded dir
      - name: Assert action completed successfully with excludes
        run: |
          echo "Checkstyle with excluded paths completed without hard failure"
          echo "PASS"
