name: Test properties_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run checkstyle with custom config and properties file
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          checkstyle_config: testdata/properties_file/test_checks.xml
          properties_file: testdata/properties_file/additional.properties
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully with properties file
        run: |
          echo "Action completed with properties_file without hard failure"
          echo "PASS"
