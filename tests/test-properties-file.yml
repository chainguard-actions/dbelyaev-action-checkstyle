name: Test checkstyle with properties file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with custom config and properties file
        id: action
        uses: .
        with:
          github_token: "dummy-token"
          workdir: testdata/java
          checkstyle_config: testdata/properties_file/test_checks.xml
          properties_file: testdata/properties_file/additional.properties
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
      - name: Assert action completed successfully with properties file
        run: |
          echo "Checkstyle with properties file completed without hard failure"
          echo "PASS"
