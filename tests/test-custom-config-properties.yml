name: Test custom checkstyle config with properties file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/java
          reporter: local
          filter_mode: nofilter
          fail_level: any
          checkstyle_config: tests/fixtures/config/custom_checks.xml
          properties_file: tests/fixtures/config/checkstyle.properties
      - name: Assert action succeeded (property resolved, no long lines)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
