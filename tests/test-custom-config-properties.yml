name: Test custom checkstyle config with properties file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/violations
          reporter: local
          filter_mode: nofilter
          fail_level: any
          checkstyle_config: tests/fixtures/config/custom.xml
          properties_file: tests/fixtures/config/checkstyle.properties
      - name: Assert action succeeded (only LineLength<=200 checked)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with custom config and resolved property"
            exit 1
          fi
          echo "PASS"
