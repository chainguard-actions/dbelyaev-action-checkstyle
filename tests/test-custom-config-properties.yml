name: Test custom config with properties file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/java-bad
          reporter: local
          filter_mode: nofilter
          fail_level: any
          checkstyle_config: tests/fixtures/custom/checkstyle.xml
          properties_file: tests/fixtures/custom/checkstyle.properties
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (maxLen=500 from properties means no violations)"
            exit 1
          fi
          echo "PASS"
