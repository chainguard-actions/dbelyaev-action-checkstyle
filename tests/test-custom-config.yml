name: Test custom checkstyle config with properties file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with custom config and properties file
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          checkstyle_config: testdata/properties_file/test_checks.xml
          properties_file: testdata/properties_file/additional.properties
      - name: Assert action completed without hard failure
        run: |
          echo "Action completed with custom config and properties file"
          echo "PASS"
