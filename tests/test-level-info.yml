name: Test checkstyle with info level and reviewdog_flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run checkstyle action with info level (default) and extra reviewdog flags
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java-clean
          checkstyle_config: google_checks.xml
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: info
          reviewdog_flags: "-tee"

      - name: Assert action completed with info level
        run: |
          echo "Action completed with info level and reviewdog_flags without hard failure"
          echo "PASS"
