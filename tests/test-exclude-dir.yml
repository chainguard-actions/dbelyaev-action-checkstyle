name: Test exclude directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with excluded directory
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          checkstyle_config: google_checks.xml
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          exclude: |
            testdata/java/excluded
      - name: Assert action completed successfully with exclusion
        run: |
          echo "Action completed with excluded directory without hard failure"
          echo "PASS"
