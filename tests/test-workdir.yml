name: Test checkstyle with custom workdir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with explicit workdir
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          level: error
          reporter: local
          filter_mode: nofilter
          fail_level: none
          checkstyle_config: google_checks.xml
      - name: Assert action completed without hard failure
        run: |
          echo "Action completed with custom workdir and error level"
          echo "PASS"
