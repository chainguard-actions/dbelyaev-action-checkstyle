name: Test built-in sun_checks config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/violations
          checkstyle_config: sun_checks.xml
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action failed (sun_checks flags violations)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected sun_checks to report violations and fail with fail_level=any"
            exit 1
          fi
          echo "PASS"
