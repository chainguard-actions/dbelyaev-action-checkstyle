name: Test sun_checks.xml built-in config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create sample Java file for sun_checks analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/java-sun"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/java-sun/Sample.java" << 'EOF'
          /**
           * Sample class for testing.
           */
          public class Sample {
              /**
               * Main method.
               * @param args command line arguments
               */
              public static void main(String[] args) {
                  System.out.println("Hello");
              }
          }
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java-sun
          checkstyle_config: sun_checks.xml
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: none

      - name: Assert action ran with sun_checks config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: checkstyle ran with sun_checks.xml successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have reported violations or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
