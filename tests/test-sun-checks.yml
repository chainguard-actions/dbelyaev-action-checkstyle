name: Test checkstyle with sun_checks config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run checkstyle with sun_checks.xml on fixture testdata
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java
          checkstyle_config: sun_checks.xml
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully with sun_checks.xml
        run: |
          echo "Action completed with sun_checks.xml without hard failure"
          echo "PASS"
