name: Test sun_checks.xml config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with sun_checks config
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          checkstyle_config: sun_checks.xml
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
      - name: Assert action completed successfully
        run: |
          echo "Action completed with sun_checks.xml without hard failure"
          echo "PASS"
