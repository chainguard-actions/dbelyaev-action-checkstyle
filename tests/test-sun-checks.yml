name: Test checkstyle with sun_checks.xml built-in config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with sun_checks.xml
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/java
          level: info
          reporter: local
          filter_mode: nofilter
          fail_level: none
          checkstyle_config: sun_checks.xml
      - name: Assert action completed without hard failure
        run: |
          echo "Action completed with sun_checks.xml config"
          echo "PASS"
