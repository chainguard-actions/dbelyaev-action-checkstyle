name: Test checkstyle with sun_checks.xml config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: checkstyle
        name: Run checkstyle with sun_checks.xml
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/java/clean
          checkstyle_config: sun_checks.xml
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: info
        continue-on-error: true

      - name: Assert checkstyle ran with sun_checks config
        env:
          OUTCOME: ${{ steps.checkstyle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (not crash with invalid config).
          # sun_checks.xml is a built-in config so it should be found.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: checkstyle ran successfully with sun_checks.xml"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step failed gracefully (sentinel repo API limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
