name: Test checkstyle with sun_checks config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run checkstyle with sun_checks.xml
        id: action
        uses: .
        with:
          github_token: "dummy-token"
          workdir: testdata/java
          checkstyle_config: sun_checks.xml
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
      - name: Assert action completed successfully
        run: |
          echo "Checkstyle with sun_checks.xml completed without hard failure"
          echo "PASS"
